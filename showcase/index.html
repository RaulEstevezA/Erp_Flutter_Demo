<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ERP Flutter · Demo</title>
  <meta name="description" content="Demo web de ERP Flutter, una app móvil de ERP para personal en movilidad: fichajes, vacaciones, clientes, partes de visita y de trabajo, y mensajería, con permisos por rol." />
  <meta name="theme-color" content="#0d1117" />
  <link rel="canonical" href="https://raulesteveza.github.io/demos/ERP_Flutter/" />
  <link rel="icon" type="image/png" href="app/favicon.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/showcase.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!--
    Página de presentación de la demo. Se publica en demos/ERP_Flutter/, la app Flutter
    compilada en demos/ERP_Flutter/app/ y el backend estático en demos/ERP_Flutter/api/
    (ver .github/workflows/deploy-demo.yml).
    Estilos alineados con https://raulesteveza.github.io (css/styles.css), copiados
    aquí para que la página no dependa de cambios en la web.
  -->
</head>
<body>

  <!-- ========== Escritorio ========== -->

  <header class="container">
    <nav class="nav">
      <a class="logo" href="/">Raúl Estévez</a>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
    </nav>
  </header>

  <main class="container stage">
    <section class="window">
      <!-- La ficha se rellena desde la plantilla #info para compartirla con la versión móvil. -->
      <div data-info></div>
    </section>

    <div>
      <div class="phone">
        <div class="screen">
          <iframe id="desktop-app" title="ERP Flutter" loading="eager" allow="clipboard-write"></iframe>
        </div>
      </div>
      <p class="hint" data-i18n="hint">Arrastra desde el borde izquierdo para abrir el menú.</p>
    </div>
  </main>

  <!-- ========== Móvil real ========== -->

  <div class="mobile-only">
    <iframe id="mobile-app" class="fullscreen-app" title="ERP Flutter"></iframe>
    <button type="button" class="info-fab" aria-label="Información" data-open-sheet>i</button>
    <div class="sheet-backdrop" data-close-sheet></div>
    <aside class="sheet" aria-label="Información">
      <div class="grabber"></div>
      <div data-info></div>
      <div class="actions">
        <button type="button" class="btn primary" data-close-sheet data-i18n="view_demo">Ver la demo</button>
      </div>
    </aside>
  </div>

  <!-- Ficha de la demo (común a escritorio y móvil) -->
  <template id="info">
    <h1>ERP Flutter</h1>
    <h2 data-i18n="subtitle">App móvil de un ERP para personal en movilidad</h2>

    <div class="tags">
      <span class="tag">Flutter</span>
      <span class="tag">Dart</span>
      <span class="tag">MVVM</span>
      <span class="tag" data-i18n="tag_roles">Roles y permisos</span>
      <span class="tag">i18n · ES/VAL/CA/EN</span>
      <span class="tag">image_picker</span>
      <span class="tag">record</span>
    </div>

    <p class="intro" data-i18n="intro">
      Fichajes, vacaciones, clientes, partes de visita y partes de trabajo con fotos,
      notas de voz y firma del cliente, y chat interno, con permisos por rol. Esta es
      la versión web de la app móvil, ejecutándose tal cual en el navegador.
    </p>

    <div class="notice">
      <strong data-i18n="notice_title">Demo de una app en producción</strong>
      <ul>
        <li data-i18n="notice_real">La app real la desarrollé en mis prácticas en Microvalencia y funciona con su ERP. Esta es una reimplementación con datos inventados y un backend estático en JSON.</li>
        <li data-i18n="notice_scope">El alcance lo marcó la empresa: la app apoya el día a día de quienes usan el ERP, no lo sustituye, así que algunas acciones se quedan en el escritorio.</li>
        <li><span data-i18n="notice_user">Entra con una cuenta de «Cuentas de demostración» (contraseña</span> <code>demo1234</code><span data-i18n="notice_user_end">): cada rol ve módulos distintos.</span></li>
        <li data-i18n="notice_storage">Lo que añadas se guarda solo en este navegador. «Restablecer datos de la demo», en el menú lateral, lo deja como al principio.</li>
      </ul>
    </div>

    <div class="actions">
      <a class="btn primary" href="https://github.com/RaulEstevezA/Erp_Flutter_Demo" target="_blank" rel="noopener" data-i18n="code">Código</a>
      <a class="btn" href="https://youtu.be/lrgRXaBEdI4" target="_blank" rel="noopener" data-i18n="video">Vídeo</a>
      <a class="btn" href="backend.html" target="_blank" rel="noopener" data-i18n="backend">Backend</a>
      <a class="btn" href="app/" target="_blank" rel="noopener" data-i18n="fullscreen">Pantalla completa</a>
      <a class="btn" href="https://raulesteveza.github.io/demos/" data-i18n="demos">Demos</a>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
