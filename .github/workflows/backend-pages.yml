# Publica el backend estático (carpeta backend/) en GitHub Pages.
# Se lanza al hacer push a main con cambios en backend/ o a mano desde la
# pestaña Actions.
name: Backend en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backend
      - id: deployment
        uses: actions/deploy-pages@v4
